<!DOCTYPE html><html lang="pl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>LICZNIKI</title><style>
*{box-sizing:border-box}body{margin:0;background:#00204e;font-family:Arial,Helvetica,sans-serif}.app{min-height:100vh;background:linear-gradient(120deg,#00204e,#064b9a 50%,#002355);color:#081326;padding:10px 7px 16px;overflow:visible}.head{position:sticky;top:0;z-index:100;isolation:isolate;padding:6px 4px;margin:-6px -4px 16px;background:linear-gradient(120deg,#00204e,#064b9a 50%,#002355);border-radius:9px;box-shadow:0 3px 8px #00153299;display:grid;grid-template-columns:minmax(0,1fr) 34px;gap:5px;align-items:center;margin-bottom:16px}.gear{background:linear-gradient(#1258a8,#002459);color:white;border:1px solid #a6d5ff;border-radius:9px;font-size:21px;height:34px;padding:0;cursor:pointer}.summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;align-items:stretch}.stat{background:linear-gradient(145deg,#fff,#d9e7fc);border:1px solid var(--accent);border-radius:8px;box-shadow:0 2px 4px #001b41aa,inset 0 1px 2px #fff;min-height:34px;text-align:center;padding:2px 1px;display:flex;flex-direction:column;justify-content:center;gap:1px}.stat.first{background:linear-gradient(#0c3b87,#00143c);border-color:#fff}.stat .lab{font-size:clamp(6px,1.3vw,9px);font-weight:900;line-height:1;color:#061329}.stat.first .lab{color:#fff}.stat .num{font-size:clamp(13px,3vw,21px);font-weight:1000;line-height:1;color:var(--accent)}
.settings{background:#fff;border:2px solid #7db4fa;border-radius:12px;padding:12px;margin:0 0 14px;color:#08234d}.settings label{display:block;font-weight:800;font-size:13px;margin:6px 0}.settings input[type=range]{width:100%;accent-color:#086af1}.settings .numbers{display:flex;gap:12px}.settings .numbers input{width:65px;padding:5px;border:1px solid #9ab5d8;border-radius:6px}.group{border:3px solid var(--group);border-radius:23px;padding:7px 5px 6px;margin:24px 0 14px;box-shadow:0 0 0 2px #ffffffb8,0 0 11px var(--group),inset 0 0 6px #ffffffa8;background:linear-gradient(90deg,color-mix(in srgb,var(--group) 65%,#001d4a),color-mix(in srgb,var(--group) 85%,#003061))}.group-title{position:relative;width:max-content;min-width:38%;margin:-27px auto 8px;text-align:center;background:linear-gradient(#36a4ff,var(--group) 45%,#00428b);border:2px solid #d8f1ff;border-radius:25px;padding:3px 16px;color:white;font-size:clamp(20px,5.4vw,35px);font-weight:1000;text-shadow:0 2px 2px #002b60;box-shadow:0 3px 6px #001b46}.group.green .group-title{background:linear-gradient(#39e448,#008e19 55%,#005c16)}.counter{background:linear-gradient(#fff,#f0f4fc);border:2px solid #fff;border-radius:17px;overflow:hidden;margin:6px 0;box-shadow:0 3px 5px #00245570}.counter-name{background:linear-gradient(180deg,color-mix(in srgb,var(--c) 65%,white),var(--c) 60%,color-mix(in srgb,var(--c) 70%,black));color:white;font-size:clamp(12px,3.3vw,23px);text-align:center;font-weight:1000;text-shadow:0 1px 2px #0007;padding:5px 2px;cursor:pointer}.cells{display:grid;grid-template-columns:1.12fr 1.08fr 1.08fr .95fr;padding:5px 3px 6px}.cell{min-width:0;text-align:center;padding:1px 3px 0;display:flex;flex-direction:column;justify-content:space-between;gap:3px}.cell+.cell{border-left:1px solid #8b9fbd}.cell-label{font-size:clamp(8px,1.9vw,13px);font-weight:900;line-height:1.03;min-height:22px;display:flex;align-items:center;justify-content:center}.cell-number{font-size:clamp(25px,6vw,45px);line-height:1;font-weight:1000;letter-spacing:-1px;color:#060d23}.sum{background:linear-gradient(#e8eff9,#cbd9ec);border:1.5px solid #91a4c1;border-radius:11px;padding:3px 0;min-height:58px;display:flex;flex-direction:column;justify-content:center}.sum .cell-label{min-height:unset}.buttons{display:flex;gap:3px;margin-top:4px}.action{display:block;width:100%;min-width:0;border:1px solid #ffffff75;border-radius:9px;padding:7px 1px;color:white;font-size:clamp(9px,2.5vw,16px);line-height:1;font-weight:900;text-shadow:0 1px 1px #0007;box-shadow:inset 0 2px 2px #ffffff66,inset 0 -3px 3px #0003,0 1px 2px #0002;cursor:pointer;touch-action:manipulation}.action:active:not(:disabled){transform:translateY(1px);filter:brightness(1.15)}.action:disabled{background:linear-gradient(#b8c1cf,#747f91)!important;opacity:.85;cursor:not-allowed}.add{background:linear-gradient(#00d948,#008f28 60%,#00601c)}.remove,.undo{background:linear-gradient(#ff4b50,#e3000a 55%,#a8000a)}.sz{background:linear-gradient(#278cff,#0458dc 55%,#003b96)}.ex{background:linear-gradient(#ffb22a,#ff8300 55%,#d75a00)}footer{margin-top:20px;text-align:center;background:linear-gradient(#0c4b9d,#00173c);border:2px solid #d8eaff;border-radius:13px;padding:11px;color:white;font-size:16px;font-weight:900;text-shadow:0 1px 2px #000;box-shadow:0 3px 5px #001533;cursor:pointer}.reset{border:1px solid #aec5e3;border-radius:8px;padding:7px;background:#f3f7ff;color:#102a51;font-weight:700}.overlay{position:fixed;inset:0;background:#00132eb8;display:flex;align-items:center;justify-content:center;padding:25px;z-index:10}.dialog{width:min(100%,340px);background:#fff;border:2px solid #79b9ff;border-radius:16px;padding:22px;text-align:center;box-shadow:0 12px 35px #0008}.dialog h2{font-size:23px;margin:0 0 18px;color:#092d6b}.dialog button{background:linear-gradient(#2188ff,#004bb6);border:0;color:#fff;border-radius:9px;padding:10px 28px;font-weight:bold}.dialog input{width:100%;padding:10px;margin:0 0 14px;border:1px solid #9bb5d6;border-radius:8px;font-size:16px}.dialog .cancel{background:#8290a3;margin-left:8px}[hidden]{display:none!important}
</style></head><body><main class="app"><div class="head"><div class="summary" id="summary"></div><button class="gear" id="settings" aria-label="Ustawienia">⚙</button></div><div class="settings" id="settings-panel" hidden><label>Liczba pozycji: <span id="count-value">6</span></label><input id="count" type="range" min="1" max="6" value="6"><div class="numbers"><label>Dodawanie<br><input id="plus" type="number" min="1" value="1"></label><label>Odejmowanie<br><input id="minus" type="number" min="1" value="5"></label></div><button class="reset" id="reset">Wyzeruj wszystkie liczniki</button></div><div id="groups"></div><footer id="footer">© M. K. 11.2026r.</footer></main><div class="overlay" id="overlay" hidden><div class="dialog"><h2 id="dialog-text"></h2><input id="dialog-input" hidden><div><button id="dialog-ok">OK</button><button class="cancel" id="dialog-cancel" hidden>Anuluj</button></div></div></div>
<script>
(()=>{
const $=id=>document.getElementById(id);
const seed=[['522694320 - ALL','#009d3e'],['522694330 - JEEP','#e4b000'],['522694570 - FIAT/ALFA','#0068e9'],['522694340 - JEEP','#e4b000'],['522694580 - FIAT','#0068e9'],['522694770 - ALFA','#e90086']];
const make=()=>seed.map(([name,color])=>({name,color,g:0,p:0,s:0,t:0,h:[]}));
let items=make(),shown=6,plus=1,minus=5;
try{const nativeData=(window.AndroidStorage&&window.AndroidStorage.load())||'';const saved=JSON.parse(nativeData||localStorage.getItem('liczniki-glossy-v1')||'null');if(saved&&Array.isArray(saved.items)&&saved.items.length===6){items=saved.items.map((x,i)=>({...make()[i],...x,h:[]}));shown=Math.max(1,Math.min(6,saved.shown||6));plus=Math.max(1,saved.plus||1);minus=Math.max(1,saved.minus||5)}}catch(e){}
$('count').value=shown;$('count-value').textContent=shown;$('plus').value=plus;$('minus').value=minus;
const save=()=>{const data=JSON.stringify({items:items.map(({h,...c})=>c),shown,plus,minus});try{if(window.AndroidStorage)window.AndroidStorage.save(data)}catch(e){console.error('Błąd zapisu Android:',e)}try{localStorage.setItem('liczniki-glossy-v1',data)}catch(e){}};
const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function summary(){const t=items.slice(0,shown).reduce((a,c)=>{for(const k of ['g','p','s','t'])a[k]+=c[k];return a},{g:0,p:0,s:0,t:0});const cards=[['ŁĄCZNY<br>LICZNIK OGÓLNY',t.g,'#ffda20',true],['ŁĄCZNIE<br>W POJEMNIKU',t.p,'#009a39',false],['ZABRANE<br>PRZEZ SZYMONA',t.s,'#145be1',false],['ŁĄCZNA<br>SUMA',t.t,'#f58212',false]];$('summary').innerHTML=cards.map(([label,v,color,first])=>`<div class="stat ${first?'first':''}" style="--accent:${color}"><div class="lab">${label}</div><div class="num">${v}</div></div>`).join('')}
function card(c,i){return `<div class="counter" style="--c:${c.color}"><div class="counter-name" data-rename="${i}">${escape(c.name)}</div><div class="cells"><div class="cell"><div class="cell-label">Licznik główny</div><div class="cell-number">${c.g}</div><div class="buttons"><button class="action add" data-i="${i}" data-a="add">+${plus}</button><button class="action remove" data-i="${i}" data-a="sub" ${c.g<minus?'disabled':''}>−${minus}</button></div></div><div class="cell"><div class="cell-label">Fizycznie<br>w pojemniku</div><div class="cell-number">${c.p}</div><button class="action sz" data-i="${i}" data-a="sz" ${c.p<5?'disabled':''}>SZYMON</button></div><div class="cell"><div class="cell-label">Zabrane<br>przez Szymona</div><div class="cell-number">${c.s}</div><button class="action ex" data-i="${i}" data-a="ex" ${c.s<5?'disabled':''}>WYMIANA</button></div><div class="cell"><div class="sum"><div class="cell-label">SUMA</div><div class="cell-number">${c.t}</div></div><button class="action undo" data-i="${i}" data-a="undo" ${!c.h.length?'disabled':''}>COFNIJ</button></div></div></div>`}
function groups(){$('groups').innerHTML=[{name:'DRZWI',start:0,color:'#0088ff',green:false},{name:'BAGAŻNIK',start:3,color:'#00a529',green:true}].filter(s=>shown>s.start).map(s=>`<section class="group ${s.green?'green':''}" style="--group:${s.color}"><div class="group-title">${s.name}</div>${items.slice(s.start,Math.min(shown,s.start+3)).map((c,j)=>card(c,s.start+j)).join('')}</section>`).join('')}
function refresh(){summary();groups();save()}
function change(i,a){const c=items[i];if(!c)return;if(a==='undo'){if(!c.h.length)return;Object.assign(c,c.h.pop());refresh();return}if(a==='sub'&&c.g<minus||a==='sz'&&c.p<5||a==='ex'&&c.s<5)return;c.h.push({g:c.g,p:c.p,s:c.s,t:c.t});if(a==='add')c.g+=plus;if(a==='sub'){c.g-=minus;c.p+=minus}if(a==='sz'){c.p-=5;c.s+=5}if(a==='ex'){c.s-=5;c.t+=5}refresh()}
let renameIndex=-1;
function dialog(message,editable=false){$('dialog-text').textContent=message;$('dialog-input').hidden=!editable;$('dialog-cancel').hidden=!editable;$('overlay').hidden=false;if(editable){$('dialog-input').value=items[renameIndex].name;$('dialog-input').focus()}}
function close(){$('overlay').hidden=true;renameIndex=-1}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b){change(+b.dataset.i,b.dataset.a);return}const n=e.target.closest('[data-rename]');if(n){renameIndex=+n.dataset.rename;dialog('Zmień nazwę pozycji',true)}});
$('dialog-ok').onclick=()=>{if(renameIndex>=0){const v=$('dialog-input').value.trim();if(v){items[renameIndex].name=v;refresh()}}close()};$('dialog-cancel').onclick=close;
$('settings').onclick=()=>{$('settings-panel').hidden=!$('settings-panel').hidden};$('count').oninput=e=>{shown=+e.target.value;$('count-value').textContent=shown;refresh()};$('plus').onchange=e=>{plus=Math.max(1,parseInt(e.target.value)||1);e.target.value=plus;refresh()};$('minus').onchange=e=>{minus=Math.max(1,parseInt(e.target.value)||1);e.target.value=minus;refresh()};$('reset').onclick=()=>{if(confirm('Wyzerować wszystkie liczniki?')){items=items.map(c=>({...c,g:0,p:0,s:0,t:0,h:[]}));refresh()}};$('footer').onclick=()=>dialog('Jesteś Najlepszy :)');refresh();
})();
</script></body></html>
